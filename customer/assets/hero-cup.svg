<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" role="img" aria-labelledby="title desc">
<title id="title">Стакан кофе Kapouch</title>
<desc id="desc">Аккуратный бумажный стакан кофе навынос в стиле программы шестого напитка.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fffaf2"/>
    <stop offset=".58" stop-color="#f2dfcc"/>
    <stop offset="1" stop-color="#dfc1a6"/>
  </linearGradient>
  <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8a5033"/>
    <stop offset="1" stop-color="#5e3223"/>
  </linearGradient>
  <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#49291f"/>
    <stop offset="1" stop-color="#24140f"/>
  </linearGradient>
  <filter id="softShadow" x="-40%" y="-40%" width="180%" height="210%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
    <feOffset dy="10" result="offset"/>
    <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.12 0 0 0 0 0.05 0 0 0 0 0.02 0 0 0 .28 0" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<ellipse cx="120" cy="263" rx="61" ry="11" fill="#1f0f09" opacity=".18"/>


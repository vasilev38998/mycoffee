    </g>
    <path d="M80 249h61" stroke="#2b1710" stroke-width="4" stroke-linecap="round" opacity=".85"/>
    <path d="M73 264h75" stroke="#5d2a1a" stroke-width="2" stroke-linecap="round" opacity=".55"/>

    <path d="M59 92l10 0-12 187c-1 12 6 22 14 27-11-4-18-12-19-23z" fill="#fff" opacity=".18"/>

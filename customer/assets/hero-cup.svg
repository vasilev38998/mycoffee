<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Кофейный стакан Kapouch</title>
<desc id="desc">Стильный прозрачный стакан капучино с кремовой пеной и логотипом Kapouch.</desc>
<defs>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".88"/>
    <stop offset=".28" stop-color="#fff9f1" stop-opacity=".50"/>
    <stop offset=".7" stop-color="#f4dfcc" stop-opacity=".22"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity=".60"/>
  </linearGradient>
  <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7b351f"/>
    <stop offset=".30" stop-color="#9b4d2f"/>
    <stop offset=".58" stop-color="#c47b4e"/>
    <stop offset="1" stop-color="#e6b987"/>
  </linearGradient>
  <linearGradient id="milk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff9ef"/>
    <stop offset=".55" stop-color="#f8ead9"/>
    <stop offset="1" stop-color="#eed2b2"/>
  </linearGradient>
  <linearGradient id="foam" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fffdf8"/>
    <stop offset=".62" stop-color="#f7e7d3"/>
    <stop offset="1" stop-color="#e4c6a5"/>
  </linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3a2118"/>
    <stop offset=".52" stop-color="#1d110d"/>
    <stop offset="1" stop-color="#0f0907"/>
  </linearGradient>
  <radialGradient id="topCoffee" cx="50%" cy="45%" r="60%">
    <stop offset="0" stop-color="#a85b36"/>
    <stop offset=".68" stop-color="#74341f"/>
    <stop offset="1" stop-color="#4a2117"/>
  </radialGradient>
  <filter id="drop" x="-50%" y="-30%" width="200%" height="190%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="13" result="blur"/>
    <feOffset dy="14" result="offset"/>
    <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.045  0 0 0 0 0.02  0 0 0 .32 0"/>
    <feBlend in="SourceGraphic"/>
  </filter>
  <clipPath id="cupClip">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-labelledby="title desc">
  <title id="title">Стакан кофе Kapouch</title>
  <desc id="desc">Тёплая иллюстрация кофейного стакана с крышкой, паром и кофейными зёрнами.</desc>
  <defs>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ec"/>
      <stop offset=".58" stop-color="#f5e5d1"/>
      <stop offset="1" stop-color="#d9baa0"/>
    </linearGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9a06f"/>
      <stop offset=".5" stop-color="#b96f42"/>
      <stop offset="1" stop-color="#8f4327"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34231f"/>
      <stop offset="1" stop-color="#120d0b"/>
    </linearGradient>
    <radialGradient id="bean" cx="35%" cy="28%" r="70%">
      <stop offset="0" stop-color="#b56331"/>
      <stop offset=".58" stop-color="#70331e"/>
      <stop offset="1" stop-color="#3c1a12"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <ellipse cx="170" cy="319" rx="102" ry="22" fill="#2a100b" opacity=".22" filter="url(#shadow)"/>

  <g fill="none" stroke="#f8d6b6" stroke-width="8" stroke-linecap="round" opacity=".82">

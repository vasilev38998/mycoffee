<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" role="img" aria-labelledby="title desc">
<title id="title">Кофейное зерно Kapouch</title>
<desc id="desc">Крупное кофейное зерно в тёплых фирменных оттенках Kapouch.</desc>
<defs>
  <linearGradient id="bean" x1="46" y1="48" x2="194" y2="248" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#8a4e2f"/>
    <stop offset=".5" stop-color="#5d301f"/>
    <stop offset="1" stop-color="#321910"/>
  </linearGradient>
  <linearGradient id="beanGlow" x1="76" y1="64" x2="150" y2="214" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#d99a62" stop-opacity=".62"/>
    <stop offset=".5" stop-color="#b66a3c" stop-opacity=".16"/>
    <stop offset="1" stop-color="#7f4229" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="crease" x1="106" y1="52" x2="139" y2="244" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#2a140d"/>
    <stop offset=".52" stop-color="#3b1d13"/>
    <stop offset="1" stop-color="#160b07"/>
  </linearGradient>
  <filter id="beanShadow" x="-45%" y="-35%" width="190%" height="195%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
    <feOffset dy="12" result="offset"/>
    <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.09 0 0 0 0 0.035 0 0 0 0 0.015 0 0 0 .34 0" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<ellipse cx="122" cy="254" rx="66" ry="13" fill="#1f0d07" opacity=".2"/>

<g transform="rotate(-13 120 151)" filter="url(#beanShadow)">
  <path id="bean-shape" d="M122 44c-42-7-77 25-91 67-15 45-3 96 30 128 27 27 68 34 102 17 38-19 58-66 49-112-9-47-45-92-90-100Z" fill="url(#bean)"/>
  <path d="M81 63c-30 15-48 49-49 85-1 38 16 73 42 94 18 14 39 20 58 17-31-18-48-42-50-73-3-43 23-80 58-105-17-10-38-14-59-18Z" fill="url(#beanGlow)"/>
  <path d="M143 51c25 18 40 43 43 71 4 37-11 69-42 95-14 12-21 25-18 40" fill="none" stroke="url(#crease)" stroke-width="15" stroke-linecap="round"/>
  <path d="M143 55c19 17 29 38 30 61 2 31-10 58-37 82-13 12-19 23-18 36" fill="none" stroke="#9b5a37" stroke-opacity=".45" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M68 101c10-21 27-34 46-39" fill="none" stroke="#f1bd88" stroke-opacity=".28" stroke-width="7" stroke-linecap="round"/>
  <path d="M62 122c-7 30-1 58 15 80" fill="none" stroke="#f7c899" stroke-opacity=".13" stroke-width="5" stroke-linecap="round"/>
</g>

<circle cx="190" cy="109" r="4" fill="#f2c46e" opacity=".82"/>
<circle cx="55" cy="193" r="2.7" fill="#f2c46e" opacity=".5"/>
</svg>
  </clipPath>
</defs>

<ellipse cx="180" cy="384" rx="104" ry="20" fill="#2f120b" opacity=".16"/>

<g filter="url(#drop)">
  <g clip-path="url(#cupClip)">
    <rect x="84" y="122" width="192" height="274" fill="url(#milk)"/>
    <rect x="84" y="205" width="192" height="191" fill="url(#coffee)"/>
    <path d="M84 206 C122 190 150 222 181 208 C211 195 243 215 276 201 V237 C245 254 211 231 181 243 C146 257 119 231 84 248 Z" fill="#9d4b2d" opacity=".46"/>
    <rect x="84" y="119" width="192" height="92" fill="url(#foam)"/>
    <path d="M92 161 C120 146 139 171 164 155 C193 136 217 169 268 148 L272 204 L88 204 Z" fill="#fbefe0" opacity=".74"/>
    <rect x="84" y="122" width="192" height="274" fill="url(#glass)"/>
    <path d="M110 132 C120 180 121 311 131 363 C133 376 140 383 150 388" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".32"/>
    <path d="M247 136 C241 205 237 298 226 358" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".28"/>
  </g>

  <path d="M86 123 C90 207 99 308 111 363 C115 383 131 393 151 393 H209 C229 393 245 383 249 363 C261 308 270 207 274 123 Z" fill="none" stroke="#fff5ea" stroke-width="3" opacity=".62"/>

  <ellipse cx="180" cy="123" rx="94" ry="23" fill="#f7e5d0" opacity=".84"/>
  <ellipse cx="180" cy="123" rx="84" ry="16" fill="url(#topCoffee)"/>
  <ellipse cx="180" cy="120" rx="66" ry="10" fill="#d49468" opacity=".38"/>

  <g>
    <path d="M78 119 Q82 93 106 88 H254 Q278 93 282 119 L278 137 H82 Z" fill="url(#rim)"/>
    <ellipse cx="180" cy="99" rx="74" ry="13" fill="#120b08"/>
    <ellipse cx="180" cy="98" rx="61" ry="8" fill="#503126" opacity=".85"/>
    <path d="M99 91 H261 Q271 92 276 104 H84 Q89 92 99 91 Z" fill="#4b2f25" opacity=".72"/>
    <path d="M224 91 C240 89 252 91 261 97" fill="none" stroke="#805745" stroke-width="4" stroke-linecap="round" opacity=".75"/>

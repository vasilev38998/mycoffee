    <text x="180" y="272" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" letter-spacing="2.4" fill="#3a1d14">KAPOUCH</text>
    <g transform="translate(164 280)" fill="#8d4a2c">
      <path d="M7 2 C-1 10 1 21 8 26 C15 20 16 9 7 2Z"/>
      <path d="M25 0 C17 8 19 19 26 24 C33 18 34 7 25 0Z"/>
      <path d="M16 19 C8 27 10 38 17 43 C24 37 25 26 16 19Z"/>
    </g>
  </g>
</g>

<g fill="none" stroke="#f4d3b1" stroke-width="6" stroke-linecap="round" opacity=".78">
  <path d="M133 67 C115 49 146 38 132 20"/>
  <path d="M178 60 C160 43 188 31 177 13"/>
  <path d="M222 67 C207 49 235 39 226 22"/>
</g>

<circle cx="286" cy="84" r="6" fill="#f5cf9e" opacity=".72"/>
<circle cx="72" cy="217" r="4" fill="#f5cf9e" opacity=".55"/>
</svg>
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>Kapouch · Проверка оплаты</title>
<style>html,body{margin:0;min-height:100%;background:#0f0f0f;color:#fff8ec;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:22px;box-sizing:border-box}.card{width:min(460px,100%);box-sizing:border-box;padding:28px 24px;border:1px solid rgba(255,255,255,.08);border-radius:26px;background:#1a1715;text-align:center}.mark{width:70px;height:70px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:#f5b93f;color:#16120d;font-size:32px;font-weight:900}h1{margin:0 0 10px;font-size:27px}p{margin:0;color:#a99f96;line-height:1.55}.status{margin:18px 0;padding:13px;border-radius:15px;background:#121110;font-weight:800}.btn{display:block;margin-top:16px;padding:14px;border-radius:15px;background:#f5b93f;color:#16120d;text-decoration:none;font-weight:900}.muted{font-size:12px;margin-top:12px}</style>
</head>
<body><main class="card"><div class="mark">₽</div><h1 id="title">Проверяем оплату</h1><p id="text">Подтверждаем платёж напрямую у Сбера. Обычно это занимает несколько секунд.</p><div class="status" id="status">Ожидаем подтверждение…</div><a class="btn" id="back" href="./#home" hidden>Вернуться в Kapouch</a><p class="muted">Не закрывайте экран сразу после оплаты.</p></main>
<script>
(function(){
const token=localStorage.getItem('kapouch_tracking_token')||'',status=document.getElementById('status'),title=document.getElementById('title'),text=document.getElementById('text'),back=document.getElementById('back');let tries=0;
function done(){localStorage.removeItem('kapouch_customer_cart');localStorage.removeItem('kapouch_checkout_request_id');title.textContent='Оплата получена';text.textContent='Заказ передан в кофейню.';status.textContent='✓ Оплачено по СБП';back.hidden=false;setTimeout(()=>location.replace('./#home'),1200)}
function failed(message){title.textContent='Оплата не подтверждена';text.textContent=message;status.textContent='Можно вернуться в корзину и повторить оплату.';back.href='./#cart';back.hidden=false}
async function check(){if(!token){failed('Не нашли заказ на этом устройстве.');return}tries++;try{const r=await fetch('../api/customer_order_status.php?token='+encodeURIComponent(token)+'&_='+Date.now(),{cache:'no-store',headers:{Accept:'application/json'}});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Ошибка проверки');const o=d.order||{};if(o.payment_status==='paid'||['new','preparing','ready','completed'].includes(o.status)){done();return}if(o.status==='cancelled'){failed('Платёж не был завершён.');return}status.textContent='Платёж ещё обрабатывается…';if(tries<20)setTimeout(check,1500);else failed('Банк пока не подтвердил оплату. Статус заказа сохранён — можно проверить его позже.')}catch(e){if(tries<12)setTimeout(check,1800);else failed('Не удалось проверить оплату из-за связи с сервером.')} }
if(new URLSearchParams(location.search).get('failed')==='1')failed('Банк сообщил, что платёж не завершён.');else check();
})();
</script></body></html>

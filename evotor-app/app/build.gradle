apply plugin: 'com.android.application'

android {
    compileSdkVersion 27
    buildToolsVersion '27.0.3'

    defaultConfig {
        applicationId 'ru.kapouch.evotor'
        minSdkVersion 22
        targetSdkVersion 25
        versionCode 31
        versionName '1.2.24'
        manifestPlaceholders = [evotorAppUuid: project.hasProperty('EVOTOR_APP_UUID') ? project.property('EVOTOR_APP_UUID') : 'bc17ef43-f590-49ca-a6f2-e940f57d0a72']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.github.evotor:push-notifications:v0.2.1'
    // rc01-v0.4.40 is the oldest integration-library tag that contains
    // SellIntegrationService/ReturnPositionsForBarcodeRequestedEvent while
    // remaining compatible with API 22 Evotor terminals.
    implementation 'com.github.evotor:integration-library:rc01-v0.4.40'
}

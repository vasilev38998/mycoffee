name: Runtime regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: kapouch_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, curl, openssl, gd, exif
          coverage: none

      - name: Create isolated test configuration
        run: |
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Kapouch Test','timezone'=>'Asia/Irkutsk','currency'=>'₽'],
            'db'=>['host'=>'127.0.0.1','name'=>'kapouch_test','user'=>'root','pass'=>'root','charset'=>'utf8mb4'],
            'security'=>['encryption_key'=>'runtime-regression-key-0123456789abcdef0123456789abcdef'],
          ];
          PHP
          mysql -h127.0.0.1 -uroot -proot kapouch_test < database/schema.sql

      - name: Bootstrap migrations and run core runtime regression
        run: php tests/runtime_regression.php

      - name: Seed staff login
        run: |
          HASH=$(php -r 'echo password_hash("RegressionPass123!", PASSWORD_DEFAULT);')
          mysql -h127.0.0.1 -uroot -proot kapouch_test -e "INSERT INTO users(name,email,password_hash,role) VALUES('Runtime Owner','runtime@example.test','$HASH','owner') ON DUPLICATE KEY UPDATE password_hash=VALUES(password_hash),role='owner';"

      - name: Start PHP HTTP server
        run: |
          php -S 127.0.0.1:8080 -t . >/tmp/kapouch-http.log 2>&1 &
          echo $! >/tmp/kapouch-http.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/login.php >/dev/null && break; sleep 1; done

      - name: HTTP smoke regression
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/install.out -w '%{http_code}' http://127.0.0.1:8080/install.php)
          test "$status" = "404"

          status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/analytics.php)
          test "$status" = "302"

          curl -sS -c /tmp/cookies.txt http://127.0.0.1:8080/login.php > /tmp/login.html
          csrf=$(python3 - <<'PY'
          import re
          html=open('/tmp/login.html',encoding='utf-8').read()
          m=re.search(r'name="csrf" value="([^"]+)"',html)
          assert m, 'csrf token not found'
          print(m.group(1))
          PY
          )
          code=$(curl -sS -b /tmp/cookies.txt -c /tmp/cookies.txt -o /tmp/login-post.out -w '%{http_code}' \
            -X POST http://127.0.0.1:8080/login.php \
            --data-urlencode "csrf=$csrf" \
            --data-urlencode 'email=runtime@example.test' \
            --data-urlencode 'password=RegressionPass123!')
          test "$code" = "302"
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:8080/index.php >/tmp/index.html
          grep -q 'Kapouch' /tmp/index.html

          curl -fsS http://127.0.0.1:8080/api/customer_catalog.php >/tmp/catalog.json
          php -r '$d=json_decode(file_get_contents("/tmp/catalog.json"),true); if(!is_array($d)||empty($d["ok"])||empty($d["products"])) exit(1);'

          code=$(curl -sS -o /tmp/status.json -w '%{http_code}' 'http://127.0.0.1:8080/api/customer_order_status.php?token=invalid')
          test "$code" = "404"

          code=$(curl -sS -o /tmp/webhook.json -w '%{http_code}' -X POST http://127.0.0.1:8080/api/customer_payment_yookassa_webhook.php -H 'Content-Type: application/json' --data '{}')
          test "$code" = "400"

          product_id=$(php -r '$d=json_decode(file_get_contents("/tmp/catalog.json"),true); echo $d["products"][0]["id"];')
          req="runtime-http-$(date +%s)-123456"
          code=$(curl -sS -o /tmp/order.json -w '%{http_code}' -X POST http://127.0.0.1:8080/api/customer_order.php \
            -H 'Content-Type: application/json' \
            --data "{\"client_order_id\":\"$req\",\"name\":\"HTTP Test\",\"phone\":\"+79005554433\",\"fulfillment_type\":\"pickup\",\"pickup_delay_minutes\":15,\"payment_method\":\"cash\",\"items\":[{\"product_id\":$product_id,\"quantity\":1,\"modifiers\":[]}]}" )
          test "$code" = "201"
          php -r '$d=json_decode(file_get_contents("/tmp/order.json"),true); if(empty($d["ok"])||empty($d["order"]["tracking_token"])||empty($d["order"]["promised_at"])) exit(1);'
          token=$(php -r '$d=json_decode(file_get_contents("/tmp/order.json"),true); echo $d["order"]["tracking_token"];')
          curl -fsS "http://127.0.0.1:8080/api/customer_order_status.php?token=$token" >/tmp/order-status.json
          php -r '$d=json_decode(file_get_contents("/tmp/order-status.json"),true); if(empty($d["ok"])||empty($d["order"]["promised_display"])) exit(1);'

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/kapouch-http.log || true

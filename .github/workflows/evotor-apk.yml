name: Evotor APK

on:
  pull_request:
    paths:
      - 'evotor-app/**'
      - '.github/workflows/evotor-apk.yml'
  push:
    branches: [main]
    paths:
      - 'evotor-app/**'
      - '.github/workflows/evotor-apk.yml'
  workflow_dispatch:
    inputs:
      evotor_app_uuid:
        description: 'Application ID из кабинета разработчика Эвотор'
        required: false
        default: 'bc17ef43-f590-49ca-a6f2-e940f57d0a72'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Evotor-era Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" 'platforms;android-27' 'build-tools;27.0.3' >/dev/null || true
          test -x "$ANDROID_HOME/build-tools/27.0.3/aapt"

      - name: Inspect live kapouch.store TLS chain
        continue-on-error: true
        run: |
          set -uo pipefail
          rm -f /tmp/live-tls.pem /tmp/live-leaf.pem
          if timeout 15 openssl s_client -connect kapouch.store:443 -servername kapouch.store -showcerts </dev/null > /tmp/live-tls.pem 2>/tmp/live-tls.err; then
            awk 'BEGIN{n=0} /-----BEGIN CERTIFICATE-----/{n++; if(n==1)printit=1} printit{print} /-----END CERTIFICATE-----/{if(printit){exit}}' /tmp/live-tls.pem > /tmp/live-leaf.pem
            echo "LIVE_TLS_CERT_COUNT=$(grep -c 'BEGIN CERTIFICATE' /tmp/live-tls.pem || true)"
            openssl x509 -in /tmp/live-leaf.pem -noout -subject -issuer -dates -ext subjectAltName
          else
            echo 'Live TLS diagnostic unavailable.'
            cat /tmp/live-tls.err || true
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4'

      - name: Validate Evotor TLS trust bridge source contract
        run: |
          set -euo pipefail
          TLS=evotor-app/app/src/main/java/ru/kapouch/evotor/EvotorTls.java
          ORDER=evotor-app/app/src/main/java/ru/kapouch/evotor/OrderApi.java
          LOYALTY=evotor-app/app/src/main/java/ru/kapouch/evotor/LoyaltyApi.java
          RAW=evotor-app/app/src/main/res/raw

          test -s "$TLS"
          grep -q 'SSLCertificateSocketFactory' "$TLS"
          grep -q 'setTrustManagers' "$TLS"
          grep -q 'CombinedTrustManager' "$TLS"
          grep -q 'EvotorTls.socketFactory' "$ORDER"
          grep -q 'EvotorTls.socketFactory' "$LOYALTY"
          grep -q 'setSSLSocketFactory' "$ORDER"
          grep -q 'setSSLSocketFactory' "$LOYALTY"
          grep -q 'KAPOUCH_HOST = "kapouch.store"' "$ORDER"
          grep -q 'ACTION_PATH = "/api/evotor_order_action.php"' "$ORDER"
          grep -q 'LOOKUP_PATH = "/api/evotor_customer_lookup.php"' "$LOYALTY"
          grep -q 'Evotor HTTPS' "$ORDER"
          grep -q 'Evotor HTTPS' "$LOYALTY"

          for cert in isrg_root_x1 isrg_root_x2 isrg_root_ye isrg_root_yr; do
            test -s "$RAW/$cert.pem"
            openssl x509 -in "$RAW/$cert.pem" -noout -subject -issuer -dates
          done

          # Old experimental TLS implementations must not be reintroduced.
          test ! -e evotor-app/app/src/main/java/ru/kapouch/evotor/KapouchTls.java
          test ! -e evotor-app/app/src/main/java/ru/kapouch/evotor/SniTlsSocketFactory.java
          test ! -e evotor-app/app/src/main/java/ru/kapouch/evotor/LegacyTls.java

      - name: Build debug APK with Evotor-compatible toolchain
        env:
          EVOTOR_APP_UUID: ${{ github.event.inputs.evotor_app_uuid || 'bc17ef43-f590-49ca-a6f2-e940f57d0a72' }}
        run: gradle -p evotor-app :app:assembleDebug -PEVOTOR_APP_UUID="$EVOTOR_APP_UUID" --no-daemon

      - name: Validate APK metadata for Evotor portal
        env:
          EVOTOR_APP_UUID: ${{ github.event.inputs.evotor_app_uuid || 'bc17ef43-f590-49ca-a6f2-e940f57d0a72' }}
        run: |
          APK=evotor-app/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/27.0.3/aapt"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/evotor-badging.txt
          grep -q "package: name='ru.kapouch.evotor' versionCode='15' versionName='1.2.8'" /tmp/evotor-badging.txt
          grep -q "sdkVersion:'21'" /tmp/evotor-badging.txt
          grep -q "targetSdkVersion:'25'" /tmp/evotor-badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/evotor-permissions.txt
          grep -q 'android.permission.INTERNET' /tmp/evotor-permissions.txt
          grep -q 'ru.evotor.devices.SCANNER_RECEIVER' /tmp/evotor-permissions.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/evotor-manifest.txt
          grep -q 'app_uuid' /tmp/evotor-manifest.txt
          grep -q "$EVOTOR_APP_UUID" /tmp/evotor-manifest.txt
          grep -q 'OrderActionReceiver' /tmp/evotor-manifest.txt
          grep -q 'OrderReminderReceiver' /tmp/evotor-manifest.txt
          grep -q 'CustomerScanReceiver' /tmp/evotor-manifest.txt
          grep -q 'ru.evotor.devices.ScannedCode' /tmp/evotor-manifest.txt
          unzip -l "$APK" | tee /tmp/evotor-apk-files.txt
          grep -q 'classes.dex' /tmp/evotor-apk-files.txt
          if grep -q 'classes2.dex' /tmp/evotor-apk-files.txt; then echo 'Unexpected multidex APK for Evotor portal' >&2; exit 1; fi
          grep -q 'res/raw/isrg_root_x1.pem' /tmp/evotor-apk-files.txt
          grep -q 'res/raw/isrg_root_x2.pem' /tmp/evotor-apk-files.txt
          grep -q 'res/raw/isrg_root_ye.pem' /tmp/evotor-apk-files.txt
          grep -q 'res/raw/isrg_root_yr.pem' /tmp/evotor-apk-files.txt
          unzip -p "$APK" classes.dex | strings > /tmp/evotor-dex-strings.txt
          grep -q 'kapouch-order-sound' /tmp/evotor-dex-strings.txt
          grep -q 'Kapouch-Orders-Evotor/1.2.8' /tmp/evotor-dex-strings.txt
          grep -q 'Evotor HTTPS' /tmp/evotor-dex-strings.txt
          grep -q 'EvotorTls' /tmp/evotor-dex-strings.txt
          grep -q 'SSLCertificateSocketFactory' /tmp/evotor-dex-strings.txt
          grep -q 'kapouch.store' /tmp/evotor-dex-strings.txt
          grep -q '/api/evotor_order_action.php' /tmp/evotor-dex-strings.txt
          grep -q '/api/evotor_customer_lookup.php' /tmp/evotor-dex-strings.txt
          grep -q 'KAPOUCH:LOYALTY:' /tmp/evotor-dex-strings.txt
          grep -q 'drink_loyalty' /tmp/evotor-dex-strings.txt
          grep -q 'ScannedCode' /tmp/evotor-dex-strings.txt
          if grep -q 'Kapouch TLS not trusted' /tmp/evotor-dex-strings.txt; then echo 'Old TLS diagnostic unexpectedly remains in APK' >&2; exit 1; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kapouch-orders-evotor-compatible
          path: evotor-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish versioned APK to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          APK=evotor-app/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/27.0.3/aapt"
          VERSION=$("$AAPT" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)
          test -n "$VERSION"
          DEST="evotor-app/releases/kapouch-orders-evotor-compatible-v${VERSION}.apk"
          if [ -e "$DEST" ]; then
            cmp -s "$APK" "$DEST" && exit 0
            echo "Refusing to overwrite existing release $DEST with different bytes" >&2
            exit 1
          fi
          cp "$APK" "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "release: add Evotor APK v${VERSION}"
          git push origin HEAD:main

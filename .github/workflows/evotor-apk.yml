name: Evotor APK

on:
  pull_request:
    paths:
      - 'evotor-app/**'
      - 'api/evotor_bridge.php'
      - '.htaccess'
      - '.github/workflows/evotor-apk.yml'
  push:
    branches: [main]
    paths:
      - 'evotor-app/**'
      - 'api/evotor_bridge.php'
      - '.htaccess'
      - '.github/workflows/evotor-apk.yml'
  workflow_dispatch:
    inputs:
      evotor_app_uuid:
        description: 'Application ID из кабинета разработчика Эвотор'
        required: false
        default: 'bc17ef43-f590-49ca-a6f2-e940f57d0a72'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Evotor-era Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" 'platforms;android-27' 'build-tools;27.0.3' >/dev/null || true
          test -x "$ANDROID_HOME/build-tools/27.0.3/aapt"

      - name: Validate live kapouch.store TLS with SNI
        run: |
          set -euo pipefail
          timeout 20 openssl s_client \
            -connect kapouch.store:443 \
            -servername kapouch.store \
            -verify_return_error \
            -verify_hostname kapouch.store \
            -showcerts </dev/null > /tmp/live-tls.pem 2>/tmp/live-tls.err
          cat /tmp/live-tls.err || true
          grep -q 'Verify return code: 0 (ok)' /tmp/live-tls.pem
          CERT_COUNT=$(grep -c 'BEGIN CERTIFICATE' /tmp/live-tls.pem || true)
          test "$CERT_COUNT" -ge 2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4'

      - name: Validate Evotor 1.2.25 source contract
        run: |
          set -euo pipefail
          BUILD=evotor-app/app/build.gradle
          TLS=evotor-app/app/src/main/java/ru/kapouch/evotor/EvotorTls.java
          HOSTNAME=evotor-app/app/src/main/java/ru/kapouch/evotor/EvotorHostnameVerifier.java
          ORDER=evotor-app/app/src/main/java/ru/kapouch/evotor/OrderApi.java
          LOYALTY=evotor-app/app/src/main/java/ru/kapouch/evotor/LoyaltyApi.java
          LOYALTY_DISCOUNT=evotor-app/app/src/main/java/ru/kapouch/evotor/LoyaltyDiscountApi.java
          DISCOUNT_SERVICE=evotor-app/app/src/main/java/ru/kapouch/evotor/KapouchDiscountService.java
          DISCOUNT_TRIGGER=evotor-app/app/src/main/java/ru/kapouch/evotor/ReceiptDiscountTrigger.java
          BRIDGE=api/evotor_bridge.php
          HTACCESS=.htaccess
          MAIN=evotor-app/app/src/main/java/ru/kapouch/evotor/MainActivity.java
          SELL=evotor-app/app/src/main/java/ru/kapouch/evotor/KapouchSellIntegrationService.java
          LINK=evotor-app/app/src/main/java/ru/kapouch/evotor/CustomerLinkService.java
          MANIFEST=evotor-app/app/src/main/AndroidManifest.xml
          RAW=evotor-app/app/src/main/res/raw
          HEX_A='4ee80751bcff28354f7fe5541bc1351a62ea4d280d9090acf1df25f1d2068989'
          HEX_B='f36dc1fef61b95e380fff55a283bd471af8e4eee5b614f66ea51a49a8812973b'
          OLD_HEX_B='f36dc1fef61b95e380fff55a283bd471af8e4eee5b614f66e881a49a8812973b'

          grep -q "minSdkVersion 22" "$BUILD"
          grep -q "versionCode 32" "$BUILD"
          grep -q "versionName '1.2.25'" "$BUILD"
          grep -q "integration-library:v0.4.36" "$BUILD"

          php -l "$BRIDGE"
          grep -q 'evotor-bridge' "$HTACCESS"
          grep -q 'api/evotor_bridge.php' "$HTACCESS"
          grep -q "kapouch_evotor" "$BRIDGE"
          grep -q 'evotor_bridge_b64url_decode' "$BRIDGE"
          grep -q "cookie-bridge" "$BRIDGE"

          grep -q 'import java.io.IOException;' "$ORDER"
          grep -q 'import java.io.IOException;' "$LOYALTY"
          grep -q 'catch (IOException primary)' "$ORDER"
          grep -q 'catch (IOException primary)' "$LOYALTY"
          grep -q 'POST оборвался:' "$ORDER"
          grep -q 'POST оборвался:' "$LOYALTY"
          grep -q 'transportMessage(primary)' "$ORDER"
          grep -q 'transportMessage(primary)' "$LOYALTY"
          grep -q 'bridgeAction(context, order, action)' "$ORDER"
          grep -q 'bridgeLookup(context, code, terminalToken, bootstrapToken)' "$LOYALTY"
          grep -q 'response.status == 405' "$ORDER"
          grep -q 'response.status == 405' "$LOYALTY"
          grep -q 'setRequestProperty("Cookie", "kapouch_evotor="' "$ORDER"
          grep -q 'setRequestProperty("Cookie", "kapouch_evotor="' "$LOYALTY"
          grep -q 'Base64.URL_SAFE' "$ORDER"
          grep -q 'Base64.URL_SAFE' "$LOYALTY"
          grep -q 'Kapouch-Orders-Evotor/1.2.24' "$ORDER"
          grep -q 'Kapouch-Orders-Evotor/1.2.24' "$LOYALTY"
          grep -q 'Kapouch-Orders-Evotor/1.2.25' "$LOYALTY_DISCOUNT"

          grep -q 'SSLCertificateSocketFactory' "$TLS"
          grep -q 'CombinedTrustManager' "$TLS"
          grep -q 'verifyReviewedLegacyLeaf' "$TLS"
          grep -q 'PreHandshakeSniSocketFactory' "$TLS"
          grep -Fq "$HEX_A" "$TLS"
          grep -Fq "$HEX_B" "$TLS"
          if grep -Fq "$OLD_HEX_B" "$TLS"; then
            echo 'Misread SPKI digest is still present.' >&2
            exit 1
          fi

          grep -q 'implements HostnameVerifier' "$HOSTNAME"
          grep -q 'DEFAULT.verify(hostname, session)' "$HOSTNAME"
          grep -q 'KAPOUCH_HOST.equalsIgnoreCase(hostname)' "$HOSTNAME"
          grep -Fq "$HEX_A" "$HOSTNAME"
          grep -Fq "$HEX_B" "$HOSTNAME"
          if grep -Eq 'TrustAll|ALLOW_ALL_HOSTNAME_VERIFIER' "$TLS" "$HOSTNAME" "$ORDER" "$LOYALTY" "$LOYALTY_DISCOUNT"; then
            echo 'TLS trust or hostname verification is too broad.' >&2
            exit 1
          fi

          grep -q 'BuildConfig.VERSION_NAME' "$MAIN"
          grep -q 'Kapouch Orders · v' "$MAIN"
          grep -q 'registerReceiver' "$MAIN"
          if grep -q 'CustomerScanReceiver' "$MANIFEST"; then
            echo 'CustomerScanReceiver must not be globally registered.' >&2
            exit 1
          fi

          grep -q 'ru.evotor.permission.SELL_INTEGRATION_SERVICE' "$MANIFEST"
          grep -q 'ru.evotor.permission.TRIGGER_RECEIPT_DISCOUNT_EVENT' "$MANIFEST"
          grep -q 'ru.evotor.event.sell.BARCODE_RECEIVED' "$MANIFEST"
          grep -q 'evo.v2.receipt.sell.receiptDiscount' "$MANIFEST"
          grep -q 'KapouchSellIntegrationService' "$MANIFEST"
          grep -q 'KapouchDiscountService' "$MANIFEST"
          grep -q 'CustomerLinkService' "$MANIFEST"
          grep -q 'extends SellIntegrationService' "$SELL"
          grep -q 'CustomerScanReceiver.KAPOUCH_PREFIX' "$SELL"
          grep -q 'Collections.emptyList()' "$SELL"
          grep -q 'extends IntentService' "$LINK"
          grep -q 'LoyaltyApi.lookup' "$LINK"
          grep -q 'ReceiptDiscountTrigger.trigger' "$LINK"
          grep -q 'extends IntegrationService' "$DISCOUNT_SERVICE"
          grep -q 'ReceiptDiscountEventResult' "$DISCOUNT_SERVICE"
          grep -q 'LoyaltyDiscountApi.quote' "$DISCOUNT_SERVICE"
          grep -q 'ACTION_TRIGGER_RECEIPT_DISCOUNT_EVENT' "$DISCOUNT_TRIGGER"
          grep -q 'KEY_LOYALTY_CARD_ID' "$DISCOUNT_TRIGGER"
          grep -q 'LoyaltyDiscountApi.confirm' "$DISCOUNT_TRIGGER"

          for cert in isrg_root_x1 isrg_root_x2 isrg_root_ye isrg_root_yr digicert_global_root_ca; do
            test -s "$RAW/$cert.pem"
            openssl x509 -in "$RAW/$cert.pem" -noout -subject -issuer -dates >/dev/null
          done

      - name: Build debug APK with Evotor-compatible toolchain
        env:
          EVOTOR_APP_UUID: ${{ github.event.inputs.evotor_app_uuid || 'bc17ef43-f590-49ca-a6f2-e940f57d0a72' }}
        run: |
          set -o pipefail
          if ! gradle -p evotor-app :app:assembleDebug -PEVOTOR_APP_UUID="$EVOTOR_APP_UUID" --no-daemon > /tmp/evotor-gradle.log 2>&1; then
            echo '=== Gradle failure summary ==='
            grep -E 'FAILURE:|What went wrong|Execution failed|Could not|error:|Compilation failed|Caused by:' /tmp/evotor-gradle.log | tail -n 100 || true
            echo '=== Gradle failure tail ==='
            tail -n 120 /tmp/evotor-gradle.log
            exit 1
          fi
          tail -n 40 /tmp/evotor-gradle.log

      - name: Validate APK metadata and broken-pipe fallback
        run: |
          set -euo pipefail
          APK=evotor-app/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/27.0.3/aapt"
          HEX_A='4ee80751bcff28354f7fe5541bc1351a62ea4d280d9090acf1df25f1d2068989'
          HEX_B='f36dc1fef61b95e380fff55a283bd471af8e4eee5b614f66ea51a49a8812973b'
          OLD_HEX_B='f36dc1fef61b95e380fff55a283bd471af8e4eee5b614f66e881a49a8812973b'

          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/evotor-badging.txt
          grep -q "package: name='ru.kapouch.evotor' versionCode='32' versionName='1.2.25'" /tmp/evotor-badging.txt
          grep -q "sdkVersion:'22'" /tmp/evotor-badging.txt
          grep -q "targetSdkVersion:'25'" /tmp/evotor-badging.txt

          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/evotor-manifest.txt
          grep -q 'ru.evotor.event.sell.BARCODE_RECEIVED' /tmp/evotor-manifest.txt
          grep -q 'ru.evotor.permission.TRIGGER_RECEIPT_DISCOUNT_EVENT' /tmp/evotor-manifest.txt
          grep -q 'evo.v2.receipt.sell.receiptDiscount' /tmp/evotor-manifest.txt
          grep -q 'KapouchSellIntegrationService' /tmp/evotor-manifest.txt
          grep -q 'KapouchDiscountService' /tmp/evotor-manifest.txt

          unzip -p "$APK" classes.dex | strings > /tmp/evotor-dex-strings.txt
          grep -q 'Kapouch-Orders-Evotor/1.2.24' /tmp/evotor-dex-strings.txt
          grep -q 'Kapouch-Orders-Evotor/1.2.25' /tmp/evotor-dex-strings.txt
          grep -q 'KAPOUCH:LOYALTY:' /tmp/evotor-dex-strings.txt
          grep -q 'evotor-bridge?type=order' /tmp/evotor-dex-strings.txt
          grep -q 'evotor-bridge?type=loyalty' /tmp/evotor-dex-strings.txt
          grep -q 'evotor.intent.action.ACTION_TRIGGER_RECEIPT_DISCOUNT_EVENT' /tmp/evotor-dex-strings.txt
          grep -q 'evotor_loyalty_discount.php' /tmp/evotor-dex-strings.txt
          grep -q 'kapouch_evotor=' /tmp/evotor-dex-strings.txt
          grep -Fq "$HEX_A" /tmp/evotor-dex-strings.txt
          grep -Fq "$HEX_B" /tmp/evotor-dex-strings.txt
          if grep -Fq "$OLD_HEX_B" /tmp/evotor-dex-strings.txt; then
            echo 'Misread SPKI digest unexpectedly remains in APK.' >&2
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kapouch-orders-evotor-compatible
          path: evotor-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish versioned APK to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          APK=evotor-app/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/27.0.3/aapt"
          VERSION=$("$AAPT" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)
          test -n "$VERSION"
          DEST="evotor-app/releases/kapouch-orders-evotor-compatible-v${VERSION}.apk"
          if [ -e "$DEST" ]; then
            echo "Release $DEST already exists; keeping immutable published APK."
            exit 0
          fi
          cp "$APK" "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "release: add Evotor APK v${VERSION}"
          git push origin HEAD:main

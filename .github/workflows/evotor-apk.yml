name: Evotor APK

on:
  pull_request:
    paths:
      - 'evotor-app/**'
      - 'api/evotor_order_action.php'
      - 'api/evotor_customer_lookup.php'
      - 'api/evotor_bridge.php'
      - '.htaccess'
      - '.github/workflows/evotor-apk.yml'
  push:
    branches: [main]
    paths:
      - 'evotor-app/**'
      - 'api/evotor_order_action.php'
      - 'api/evotor_customer_lookup.php'
      - 'api/evotor_bridge.php'
      - '.htaccess'
      - '.github/workflows/evotor-apk.yml'
  workflow_dispatch:
    inputs:
      evotor_app_uuid:
        description: 'Application ID из кабинета разработчика Эвотор'
        required: false
        default: 'bc17ef43-f590-49ca-a6f2-e940f57d0a72'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Evotor-era Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" 'platforms;android-27' 'build-tools;27.0.3' >/dev/null || true
          test -x "$ANDROID_HOME/build-tools/27.0.3/aapt"

      - name: Validate live kapouch.store TLS with SNI
        run: |
          set -euo pipefail
          timeout 20 openssl s_client \
            -connect kapouch.store:443 \
            -servername kapouch.store \
            -verify_return_error \
            -verify_hostname kapouch.store \
            -showcerts </dev/null > /tmp/live-tls.pem 2>/tmp/live-tls.err
          cat /tmp/live-tls.err || true
          grep -q 'Verify return code: 0 (ok)' /tmp/live-tls.pem
          CERT_COUNT=$(grep -c 'BEGIN CERTIFICATE' /tmp/live-tls.pem || true)
          echo "LIVE_TLS_CERT_COUNT=$CERT_COUNT"
          test "$CERT_COUNT" -ge 2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4'

      - name: Validate Evotor 1.2.21 source contract
        run: |
          set -euo pipefail
          TLS=evotor-app/app/src/main/java/ru/kapouch/evotor/EvotorTls.java
          HOSTNAME=evotor-app/app/src/main/java/ru/kapouch/evotor/EvotorHostnameVerifier.java
          ORDER=evotor-app/app/src/main/java/ru/kapouch/evotor/OrderApi.java
          LOYALTY=evotor-app/app/src/main/java/ru/kapouch/evotor/LoyaltyApi.java
          BRIDGE=api/evotor_bridge.php
          HTACCESS=.htaccess
          SCAN=evotor-app/app/src/main/java/ru/kapouch/evotor/CustomerScanReceiver.java
          MAIN=evotor-app/app/src/main/java/ru/kapouch/evotor/MainActivity.java
          MANIFEST=evotor-app/app/src/main/AndroidManifest.xml
          RAW=evotor-app/app/src/main/res/raw
          HEX_A='4ee80751bcff28354f7fe5541bc1351a62ea4d280d9090acf1df25f1d2068989'
          HEX_B='f36dc1fef61b95e380fff55a283bd471af8e4eee5b614f66ea51a49a8812973b'
          OLD_HEX_B='f36dc1fef61b95e380fff55a283bd471af8e4eee5b614f66e881a49a8812973b'

          php -l "$BRIDGE"
          grep -q 'evotor-bridge' "$HTACCESS"
          grep -q 'api/evotor_bridge.php' "$HTACCESS"
          grep -q "type=order" "$ORDER"
          grep -q "type=loyalty" "$LOYALTY"
          grep -q 'BRIDGE_URL' "$ORDER"
          grep -q 'BRIDGE_URL' "$LOYALTY"
          grep -q 'response.status == 405' "$ORDER"
          grep -q 'response.status == 405' "$LOYALTY"
          grep -q 'X-Kapouch-Evotor-Bridge' "$ORDER"
          grep -q 'X-Kapouch-Evotor-Bridge' "$LOYALTY"
          grep -q 'X-Kapouch-Action' "$ORDER"
          grep -q 'X-Kapouch-Order-Id' "$ORDER"
          grep -q 'X-Kapouch-Loyalty-Code' "$LOYALTY"
          grep -q 'X-Kapouch-Bootstrap-Order-Token' "$LOYALTY"
          grep -q "transport'=>'root-bridge'" "$BRIDGE"
          grep -q 'count($_GET)!==1' "$BRIDGE"
          grep -q "\['order','loyalty'\]" "$BRIDGE"

          test -s "$TLS"
          test -s "$HOSTNAME"
          grep -q 'SSLCertificateSocketFactory' "$TLS"
          grep -q 'CombinedTrustManager' "$TLS"
          grep -q 'verifyReviewedLegacyLeaf' "$TLS"
          grep -q 'PreHandshakeSniSocketFactory' "$TLS"
          grep -q 'delegate.setHostname(socket, hostname);' "$TLS"
          grep -Fq "$HEX_A" "$TLS"
          grep -Fq "$HEX_B" "$TLS"
          if grep -Fq "$OLD_HEX_B" "$TLS"; then
            echo 'Misread SPKI digest is still present.' >&2
            exit 1
          fi

          grep -q 'implements HostnameVerifier' "$HOSTNAME"
          grep -q 'DEFAULT.verify(hostname, session)' "$HOSTNAME"
          grep -q 'KAPOUCH_HOST.equalsIgnoreCase(hostname)' "$HOSTNAME"
          grep -q 'peer.length != 1' "$HOSTNAME"
          grep -q 'getSubjectAlternativeNames()' "$HOSTNAME"
          grep -q 'hasExactCommonName(leaf, KAPOUCH_HOST)' "$HOSTNAME"
          grep -Fq "$HEX_A" "$HOSTNAME"
          grep -Fq "$HEX_B" "$HOSTNAME"
          if grep -Fq "$OLD_HEX_B" "$HOSTNAME"; then
            echo 'Misread SPKI digest is present in hostname verifier.' >&2
            exit 1
          fi
          if grep -Eq 'TrustAll|ALLOW_ALL_HOSTNAME_VERIFIER' "$TLS" "$HOSTNAME" "$ORDER" "$LOYALTY"; then
            echo 'TLS trust or hostname verification is too broad.' >&2
            exit 1
          fi

          grep -q 'secure.setHostnameVerifier(EvotorHostnameVerifier.INSTANCE);' "$ORDER" || grep -q 'connection.setHostnameVerifier(EvotorHostnameVerifier.INSTANCE);' "$ORDER"
          grep -q 'secure.setHostnameVerifier(EvotorHostnameVerifier.INSTANCE);' "$LOYALTY" || grep -q 'connection.setHostnameVerifier(EvotorHostnameVerifier.INSTANCE);' "$LOYALTY"
          grep -q 'Kapouch-Orders-Evotor/1.2.21' "$ORDER"
          grep -q 'Kapouch-Orders-Evotor/1.2.21' "$LOYALTY"

          grep -q 'BuildConfig.VERSION_NAME' "$MAIN"
          grep -q 'Kapouch Orders · v' "$MAIN"
          grep -q 'Foreground-only loyalty scanner receiver' "$SCAN"
          grep -q 'registerReceiver(' "$MAIN"
          grep -q 'unregisterReceiver(' "$MAIN"
          if grep -q 'CustomerScanReceiver' "$MANIFEST"; then
            echo 'CustomerScanReceiver must not be globally registered.' >&2
            exit 1
          fi

          for cert in isrg_root_x1 isrg_root_x2 isrg_root_ye isrg_root_yr digicert_global_root_ca; do
            test -s "$RAW/$cert.pem"
            openssl x509 -in "$RAW/$cert.pem" -noout -subject -issuer -dates
          done

      - name: Build debug APK with Evotor-compatible toolchain
        env:
          EVOTOR_APP_UUID: ${{ github.event.inputs.evotor_app_uuid || 'bc17ef43-f590-49ca-a6f2-e940f57d0a72' }}
        run: gradle -p evotor-app :app:assembleDebug -PEVOTOR_APP_UUID="$EVOTOR_APP_UUID" --no-daemon

      - name: Validate APK metadata and extensionless bridge fallback
        env:
          EVOTOR_APP_UUID: ${{ github.event.inputs.evotor_app_uuid || 'bc17ef43-f590-49ca-a6f2-e940f57d0a72' }}
        run: |
          set -euo pipefail
          APK=evotor-app/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/27.0.3/aapt"
          HEX_A='4ee80751bcff28354f7fe5541bc1351a62ea4d280d9090acf1df25f1d2068989'
          HEX_B='f36dc1fef61b95e380fff55a283bd471af8e4eee5b614f66ea51a49a8812973b'
          OLD_HEX_B='f36dc1fef61b95e380fff55a283bd471af8e4eee5b614f66e881a49a8812973b'

          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/evotor-badging.txt
          grep -q "package: name='ru.kapouch.evotor' versionCode='28' versionName='1.2.21'" /tmp/evotor-badging.txt
          grep -q "sdkVersion:'21'" /tmp/evotor-badging.txt
          grep -q "targetSdkVersion:'25'" /tmp/evotor-badging.txt

          unzip -l "$APK" | tee /tmp/evotor-apk-files.txt
          grep -q 'classes.dex' /tmp/evotor-apk-files.txt
          if grep -q 'classes2.dex' /tmp/evotor-apk-files.txt; then
            echo 'Unexpected multidex APK.' >&2
            exit 1
          fi

          unzip -p "$APK" classes.dex | strings > /tmp/evotor-dex-strings.txt
          grep -q 'Kapouch-Orders-Evotor/1.2.21' /tmp/evotor-dex-strings.txt
          grep -q 'PreHandshakeSniSocketFactory' /tmp/evotor-dex-strings.txt
          grep -q 'EvotorHostnameVerifier' /tmp/evotor-dex-strings.txt
          grep -q 'evotor-bridge?type=order' /tmp/evotor-dex-strings.txt
          grep -q 'evotor-bridge?type=loyalty' /tmp/evotor-dex-strings.txt
          grep -q 'X-Kapouch-Evotor-Bridge' /tmp/evotor-dex-strings.txt
          grep -Fq "$HEX_A" /tmp/evotor-dex-strings.txt
          grep -Fq "$HEX_B" /tmp/evotor-dex-strings.txt
          if grep -Fq "$OLD_HEX_B" /tmp/evotor-dex-strings.txt; then
            echo 'Misread SPKI digest unexpectedly remains in APK.' >&2
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kapouch-orders-evotor-compatible
          path: evotor-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish versioned APK to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          APK=evotor-app/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/27.0.3/aapt"
          VERSION=$("$AAPT" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)
          test -n "$VERSION"
          DEST="evotor-app/releases/kapouch-orders-evotor-compatible-v${VERSION}.apk"
          if [ -e "$DEST" ]; then
            echo "Release $DEST already exists; keeping immutable published APK."
            exit 0
          fi
          cp "$APK" "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "release: add Evotor APK v${VERSION}"
          git push origin HEAD:main

name: Evotor APK

on:
  pull_request:
    paths:
      - 'evotor-app/**'
      - '.github/workflows/evotor-apk.yml'
  push:
    branches: [main]
    paths:
      - 'evotor-app/**'
      - '.github/workflows/evotor-apk.yml'
  workflow_dispatch:
    inputs:
      evotor_app_uuid:
        description: 'Application ID из кабинета разработчика Эвотор'
        required: false
        default: 'bc17ef43-f590-49ca-a6f2-e940f57d0a72'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Evotor-era Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" 'platforms;android-27' 'build-tools;27.0.3' >/dev/null || true
          test -x "$ANDROID_HOME/build-tools/27.0.3/aapt"

      - name: Validate live kapouch.store TLS chain and pinned no-SNI fallback
        run: |
          set -euo pipefail
          EXPECTED_NO_SNI_SPKI='TugHUbz/KDVPf+VUG8E1GmLqTSgNkJCs8d8l8dIGiYk='
          rm -f /tmp/live-tls.pem /tmp/live-leaf.pem /tmp/live-tls.err /tmp/no-sni.pem /tmp/no-sni-leaf.pem

          timeout 20 openssl s_client \
            -connect kapouch.store:443 \
            -servername kapouch.store \
            -verify_return_error \
            -verify_hostname kapouch.store \
            -showcerts </dev/null > /tmp/live-tls.pem 2>/tmp/live-tls.err
          cat /tmp/live-tls.err || true
          grep -q 'Verify return code: 0 (ok)' /tmp/live-tls.pem
          CERT_COUNT=$(grep -c 'BEGIN CERTIFICATE' /tmp/live-tls.pem || true)
          echo "LIVE_TLS_CERT_COUNT=$CERT_COUNT"
          if [ "$CERT_COUNT" -lt 2 ]; then
            echo 'kapouch.store did not serve an intermediate certificate; old Android clients may fail trust validation.' >&2
            exit 1
          fi
          awk 'BEGIN{n=0} /-----BEGIN CERTIFICATE-----/{n++; if(n==1)printit=1} printit{print} /-----END CERTIFICATE-----/{if(printit){exit}}' /tmp/live-tls.pem > /tmp/live-leaf.pem
          echo '=== with SNI ==='
          openssl x509 -in /tmp/live-leaf.pem -noout -subject -issuer -dates -ext subjectAltName

          # Physical Evotor OS 4.x reproduces Beget's no-SNI self-signed leaf.
          # Fail the release if that public key rotates: widening trust silently is
          # forbidden; the replacement key must be reviewed and pinned explicitly.
          timeout 20 openssl s_client -connect kapouch.store:443 -noservername -showcerts </dev/null > /tmp/no-sni.pem 2>/dev/null || true
          awk 'BEGIN{n=0} /-----BEGIN CERTIFICATE-----/{n++; if(n==1)printit=1} printit{print} /-----END CERTIFICATE-----/{if(printit){exit}}' /tmp/no-sni.pem > /tmp/no-sni-leaf.pem || true
          test -s /tmp/no-sni-leaf.pem
          echo '=== without SNI (pinned compatibility leaf) ==='
          openssl x509 -in /tmp/no-sni-leaf.pem -noout -subject -issuer -serial -dates -fingerprint -sha256 -ext subjectAltName
          openssl x509 -in /tmp/no-sni-leaf.pem -noout -checkhost kapouch.store
          NO_SNI_SPKI_SHA256=$(openssl x509 -in /tmp/no-sni-leaf.pem -pubkey -noout \
            | openssl pkey -pubin -outform DER \
            | openssl dgst -sha256 -binary \
            | openssl base64 -A)
          echo "NO_SNI_SPKI_SHA256=$NO_SNI_SPKI_SHA256"
          test "$NO_SNI_SPKI_SHA256" = "$EXPECTED_NO_SNI_SPKI"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4'

      - name: Validate Evotor TLS and foreground loyalty scanner source contract
        run: |
          set -euo pipefail
          TLS=evotor-app/app/src/main/java/ru/kapouch/evotor/EvotorTls.java
          ORDER=evotor-app/app/src/main/java/ru/kapouch/evotor/OrderApi.java
          LOYALTY=evotor-app/app/src/main/java/ru/kapouch/evotor/LoyaltyApi.java
          SCAN=evotor-app/app/src/main/java/ru/kapouch/evotor/CustomerScanReceiver.java
          MAIN=evotor-app/app/src/main/java/ru/kapouch/evotor/MainActivity.java
          MANIFEST=evotor-app/app/src/main/AndroidManifest.xml
          RAW=evotor-app/app/src/main/res/raw

          test -s "$TLS"
          grep -q 'SSLCertificateSocketFactory' "$TLS"
          grep -q 'setTrustManagers' "$TLS"
          grep -q 'CombinedTrustManager' "$TLS"
          grep -q 'verifyPinnedPublicChain' "$TLS"
          grep -q 'verifyLegacyNoSniLeaf' "$TLS"
          grep -Fq 'TugHUbz/KDVPf+VUG8E1GmLqTSgNkJCs8d8l8dIGiYk=' "$TLS"
          grep -q 'fallback SPKI mismatch' "$TLS"
          grep -q 'leaf.verify(leaf.getPublicKey())' "$TLS"
          grep -q 'Kapouch TLS chain rejected:' "$TLS"
          grep -q 'FixedSniSocketFactory' "$TLS"
          grep -q 'delegate.setHostname(socket, hostname)' "$TLS"
          grep -q 'delegate.setUseSessionTickets(socket, true)' "$TLS"
          grep -q 'KAPOUCH_HOST = "kapouch.store"' "$TLS"
          if grep -q 'setHostnameVerifier' "$TLS" "$ORDER" "$LOYALTY"; then
            echo 'Hostname verification bypass is forbidden.' >&2
            exit 1
          fi

          grep -q 'EvotorTls.socketFactory' "$ORDER"
          grep -q 'EvotorTls.socketFactory' "$LOYALTY"
          grep -q 'setSSLSocketFactory' "$ORDER"
          grep -q 'setSSLSocketFactory' "$LOYALTY"
          grep -q 'KAPOUCH_HOST = "kapouch.store"' "$ORDER"
          grep -q 'ACTION_PATH = "/api/evotor_order_action.php"' "$ORDER"
          grep -q 'LOOKUP_PATH = "/api/evotor_customer_lookup.php"' "$LOYALTY"
          grep -q 'Evotor HTTPS' "$ORDER"
          grep -q 'Evotor HTTPS' "$LOYALTY"
          grep -q 'Kapouch-Orders-Evotor/1.2.11' "$ORDER"
          grep -q 'Kapouch-Orders-Evotor/1.2.11' "$LOYALTY"

          # Loyalty QR handling is intentionally foreground-only. A manifest
          # receiver caused the stock Evotor sales UI to also resolve the QR as
          # a product barcode, and abortBroadcast() did not suppress that path.
          grep -q 'Foreground-only loyalty scanner receiver' "$SCAN"
          grep -q 'registerReceiver(' "$MAIN"
          grep -q 'unregisterReceiver(' "$MAIN"
          grep -q 'ru.evotor.devices.SCANNER_SENDER' "$MAIN"
          grep -q 'CustomerScanReceiver.ACTION_SCANNED' "$MAIN"
          grep -q 'СКАНИРОВАТЬ КАРТУ КЛИЕНТА' "$MAIN"
          if grep -q 'abortBroadcast();' "$SCAN" "$MAIN"; then
            echo 'Do not rely on ordered-broadcast abortion for loyalty scanning.' >&2
            exit 1
          fi
          if grep -q 'CustomerScanReceiver' "$MANIFEST"; then
            echo 'CustomerScanReceiver must not be globally registered in the manifest.' >&2
            exit 1
          fi
          if grep -q 'ru.evotor.devices.ScannedCode' "$MANIFEST"; then
            echo 'Scanner action must not be globally registered in the manifest.' >&2
            exit 1
          fi

          for cert in isrg_root_x1 isrg_root_x2 isrg_root_ye isrg_root_yr digicert_global_root_ca; do
            test -s "$RAW/$cert.pem"
            openssl x509 -in "$RAW/$cert.pem" -noout -subject -issuer -dates
          done
          DIGICERT_FP=$(openssl x509 -in "$RAW/digicert_global_root_ca.pem" -noout -fingerprint -sha256 | sed 's/.*=//;s/://g' | tr '[:upper:]' '[:lower:]')
          test "$DIGICERT_FP" = '4348a0e9444c78cb265e058d5e8944b4d84f9662bd26db257f8934a443c70161'

          # Old experimental TLS implementations must not be reintroduced.
          test ! -e evotor-app/app/src/main/java/ru/kapouch/evotor/KapouchTls.java
          test ! -e evotor-app/app/src/main/java/ru/kapouch/evotor/SniTlsSocketFactory.java
          test ! -e evotor-app/app/src/main/java/ru/kapouch/evotor/LegacyTls.java

      - name: Build debug APK with Evotor-compatible toolchain
        env:
          EVOTOR_APP_UUID: ${{ github.event.inputs.evotor_app_uuid || 'bc17ef43-f590-49ca-a6f2-e940f57d0a72' }}
        run: gradle -p evotor-app :app:assembleDebug -PEVOTOR_APP_UUID="$EVOTOR_APP_UUID" --no-daemon

      - name: Validate APK metadata for Evotor portal
        env:
          EVOTOR_APP_UUID: ${{ github.event.inputs.evotor_app_uuid || 'bc17ef43-f590-49ca-a6f2-e940f57d0a72' }}
        run: |
          APK=evotor-app/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/27.0.3/aapt"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/evotor-badging.txt
          grep -q "package: name='ru.kapouch.evotor' versionCode='18' versionName='1.2.11'" /tmp/evotor-badging.txt
          grep -q "sdkVersion:'21'" /tmp/evotor-badging.txt
          grep -q "targetSdkVersion:'25'" /tmp/evotor-badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/evotor-permissions.txt
          grep -q 'android.permission.INTERNET' /tmp/evotor-permissions.txt
          grep -q 'ru.evotor.devices.SCANNER_RECEIVER' /tmp/evotor-permissions.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/evotor-manifest.txt
          grep -q 'app_uuid' /tmp/evotor-manifest.txt
          grep -q "$EVOTOR_APP_UUID" /tmp/evotor-manifest.txt
          grep -q 'OrderActionReceiver' /tmp/evotor-manifest.txt
          grep -q 'OrderReminderReceiver' /tmp/evotor-manifest.txt
          if grep -q 'CustomerScanReceiver' /tmp/evotor-manifest.txt; then
            echo 'CustomerScanReceiver unexpectedly present in packaged manifest.' >&2
            exit 1
          fi
          if grep -q 'ru.evotor.devices.ScannedCode' /tmp/evotor-manifest.txt; then
            echo 'Global scanner action unexpectedly present in packaged manifest.' >&2
            exit 1
          fi
          unzip -l "$APK" | tee /tmp/evotor-apk-files.txt
          grep -q 'classes.dex' /tmp/evotor-apk-files.txt
          if grep -q 'classes2.dex' /tmp/evotor-apk-files.txt; then echo 'Unexpected multidex APK for Evotor portal' >&2; exit 1; fi
          grep -q 'res/raw/isrg_root_x1.pem' /tmp/evotor-apk-files.txt
          grep -q 'res/raw/isrg_root_x2.pem' /tmp/evotor-apk-files.txt
          grep -q 'res/raw/isrg_root_ye.pem' /tmp/evotor-apk-files.txt
          grep -q 'res/raw/isrg_root_yr.pem' /tmp/evotor-apk-files.txt
          grep -q 'res/raw/digicert_global_root_ca.pem' /tmp/evotor-apk-files.txt
          unzip -p "$APK" classes.dex | strings > /tmp/evotor-dex-strings.txt
          grep -q 'kapouch-order-sound' /tmp/evotor-dex-strings.txt
          grep -q 'Kapouch-Orders-Evotor/1.2.11' /tmp/evotor-dex-strings.txt
          grep -q 'Evotor HTTPS' /tmp/evotor-dex-strings.txt
          grep -q 'EvotorTls' /tmp/evotor-dex-strings.txt
          grep -q 'FixedSniSocketFactory' /tmp/evotor-dex-strings.txt
          grep -q 'Unable to configure SNI for' /tmp/evotor-dex-strings.txt
          grep -q 'Kapouch TLS chain rejected:' /tmp/evotor-dex-strings.txt
          grep -q 'fallback SPKI mismatch' /tmp/evotor-dex-strings.txt
          grep -Fq 'TugHUbz/KDVPf+VUG8E1GmLqTSgNkJCs8d8l8dIGiYk=' /tmp/evotor-dex-strings.txt
          grep -q 'SSLCertificateSocketFactory' /tmp/evotor-dex-strings.txt
          grep -q 'kapouch.store' /tmp/evotor-dex-strings.txt
          grep -q '/api/evotor_order_action.php' /tmp/evotor-dex-strings.txt
          grep -q '/api/evotor_customer_lookup.php' /tmp/evotor-dex-strings.txt
          grep -q 'KAPOUCH:LOYALTY:' /tmp/evotor-dex-strings.txt
          grep -q 'drink_loyalty' /tmp/evotor-dex-strings.txt
          grep -q 'ru.evotor.devices.ScannedCode' /tmp/evotor-dex-strings.txt
          grep -q 'ru.evotor.devices.SCANNER_SENDER' /tmp/evotor-dex-strings.txt
          if grep -q 'Kapouch TLS not trusted' /tmp/evotor-dex-strings.txt; then echo 'Old TLS diagnostic unexpectedly remains in APK' >&2; exit 1; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kapouch-orders-evotor-compatible
          path: evotor-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish versioned APK to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          APK=evotor-app/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/27.0.3/aapt"
          VERSION=$("$AAPT" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)
          test -n "$VERSION"
          DEST="evotor-app/releases/kapouch-orders-evotor-compatible-v${VERSION}.apk"
          # Versioned releases are immutable. Rebuilding an already-published version must
          # not rewrite it just because APK packaging produced different bytes.
          if [ -e "$DEST" ]; then
            echo "Release $DEST already exists; keeping immutable published APK."
            exit 0
          fi
          cp "$APK" "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "release: add Evotor APK v${VERSION}"
          git push origin HEAD:main

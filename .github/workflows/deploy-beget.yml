name: Deploy Beget delta

on:
  workflow_run:
    workflows: ["Project quality"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Commit to deploy (empty = current main)"
        required: false
        type: string
      base_sha:
        description: "Optional base commit for the delta (empty = last successful deploy marker)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: beget-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BEGET_HOST: ${{ secrets.BEGET_HOST }}
      BEGET_USER: ${{ secrets.BEGET_USER }}
      BEGET_SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
      BEGET_PATH: ${{ secrets.BEGET_PATH }}
      BEGET_PORT: ${{ secrets.BEGET_PORT }}
      BEGET_KNOWN_HOSTS: ${{ secrets.BEGET_KNOWN_HOSTS }}

    steps:
      - name: Check deploy configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in BEGET_HOST BEGET_USER BEGET_SSH_KEY BEGET_PATH; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Beget deploy is not configured yet. Missing GitHub Secrets: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            echo "The workflow is intentionally skipped until all required secrets are present." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Resolve target commit
        if: steps.config.outputs.configured == 'true'
        id: target
        env:
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            sha="${INPUT_SHA:-${GITHUB_SHA}}"
          else
            sha="${EVENT_SHA}"
          fi
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Invalid target SHA" >&2; exit 1; }
          echo "sha=${sha,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout target
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Wait for Runtime regression on main
        if: steps.config.outputs.configured == 'true' && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/runtime-regression.yml/runs?head_sha=${TARGET_SHA}&event=push&per_page=5"
          for attempt in $(seq 1 40); do
            json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api")"
            status="$(jq -r '.workflow_runs[0].status // empty' <<<"$json")"
            conclusion="$(jq -r '.workflow_runs[0].conclusion // empty' <<<"$json")"
            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" == "success" ]]; then
                echo "Runtime regression passed for ${TARGET_SHA}."
                exit 0
              fi
              echo "Runtime regression finished with conclusion: ${conclusion:-unknown}" >&2
              exit 1
            fi
            echo "Waiting for Runtime regression (${attempt}/40, status=${status:-not-started})..."
            sleep 15
          done
          echo "Timed out waiting for Runtime regression for ${TARGET_SHA}." >&2
          exit 1

      - name: Validate Beget connection settings
        if: steps.config.outputs.configured == 'true'
        id: sshcfg
        shell: bash
        run: |
          set -euo pipefail
          port="${BEGET_PORT:-22}"
          [[ "$BEGET_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "BEGET_HOST contains unsupported characters" >&2; exit 1; }
          [[ "$BEGET_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "BEGET_USER contains unsupported characters" >&2; exit 1; }
          [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 )) || { echo "BEGET_PORT must be 1..65535" >&2; exit 1; }
          [[ "$BEGET_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "BEGET_PATH must be an absolute path without spaces or shell characters" >&2; exit 1; }
          [[ "$BEGET_PATH" != "/" && "$BEGET_PATH" != *"/../"* && "$BEGET_PATH" != *"//"* ]] || { echo "Unsafe BEGET_PATH" >&2; exit 1; }
          grep -Eq 'BEGIN [A-Z0-9 ]*PRIVATE KEY' <<<"$BEGET_SSH_KEY" || { echo "BEGET_SSH_KEY does not look like a private key" >&2; exit 1; }
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        if: steps.config.outputs.configured == 'true'
        env:
          PORT: ${{ steps.sshcfg.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$BEGET_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/beget_deploy"
          chmod 600 "$HOME/.ssh/beget_deploy"
          : > "$HOME/.ssh/known_hosts"
          if [[ -n "${BEGET_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$BEGET_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            echo "BEGET_KNOWN_HOSTS is not set; using ssh-keyscan trust-on-first-use." >> "$GITHUB_STEP_SUMMARY"
            ssh-keyscan -T 10 -p "$PORT" -H "$BEGET_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          [[ -s "$HOME/.ssh/known_hosts" ]] || { echo "Could not obtain Beget SSH host key" >&2; exit 1; }

      - name: Preflight remote directory
        if: steps.config.outputs.configured == 'true'
        env:
          PORT: ${{ steps.sshcfg.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$PORT" -i "$HOME/.ssh/beget_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$BEGET_USER@$BEGET_HOST" \
            "test -d '$BEGET_PATH' && test -w '$BEGET_PATH' && command -v rsync >/dev/null"

      - name: Resolve deployment base
        if: steps.config.outputs.configured == 'true'
        id: base
        env:
          PORT: ${{ steps.sshcfg.outputs.port }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          INPUT_BASE: ${{ inputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          base=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "${INPUT_BASE:-}" ]]; then
            base="${INPUT_BASE,,}"
          else
            marker="$(ssh -p "$PORT" -i "$HOME/.ssh/beget_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes "$BEGET_USER@$BEGET_HOST" "cat '$BEGET_PATH/.kapouch-deployed-sha' 2>/dev/null || true")"
            if [[ "$marker" =~ ^[0-9a-fA-F]{40}$ ]]; then base="${marker,,}"; fi
          fi
          if [[ -z "$base" ]]; then
            base="$(git rev-parse "${TARGET_SHA}^")"
            echo "No valid remote deploy marker found; using target parent as the delta base." >> "$GITHUB_STEP_SUMMARY"
            echo "Before enabling automatic deploy for the first time, make sure Beget already matches that parent commit, or run this workflow manually with base_sha." >> "$GITHUB_STEP_SUMMARY"
          fi
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid base SHA" >&2; exit 1; }
          git cat-file -e "${base}^{commit}" 2>/dev/null || { echo "Base commit is not available in repository history: $base" >&2; exit 1; }
          git merge-base --is-ancestor "$base" "$TARGET_SHA" || { echo "Deploy base is not an ancestor of target; refusing unsafe delta." >&2; exit 1; }
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Build safe changed-file manifest
        if: steps.config.outputs.configured == 'true'
        id: manifest
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/beget_delta_manifest.py \
            --base "$BASE_SHA" \
            --head "$TARGET_SHA" \
            --upload-output "$RUNNER_TEMP/beget-upload.bin" \
            --delete-output "$RUNNER_TEMP/beget-delete.bin" \
            --summary-output "$RUNNER_TEMP/beget-summary.md" \
            --github-output "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/beget-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload changed files
        if: steps.config.outputs.configured == 'true' && steps.manifest.outputs.upload_count != '0'
        env:
          PORT: ${{ steps.sshcfg.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          rsync -rltz --relative --from0 --files-from="$RUNNER_TEMP/beget-upload.bin" \
            --delay-updates --itemize-changes \
            -e "ssh -p $PORT -i $HOME/.ssh/beget_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ "$BEGET_USER@$BEGET_HOST:${BEGET_PATH%/}/"

      - name: Remove files deleted from Git
        if: steps.config.outputs.configured == 'true' && steps.manifest.outputs.delete_count != '0'
        env:
          PORT: ${{ steps.sshcfg.outputs.port }}
        shell: bash
        run: |
          set -euo pipefail
          export DELETE_MANIFEST="$RUNNER_TEMP/beget-delete.bin"
          python3 - <<'PY' > "$RUNNER_TEMP/beget-delete.sh"
          import os, shlex
          root=os.environ['BEGET_PATH'].rstrip('/')
          data=open(os.environ['DELETE_MANIFEST'],'rb').read().split(b'\0')
          print('set -euo pipefail')
          for raw in data:
              if not raw: continue
              rel=raw.decode('utf-8')
              print('rm -f -- '+shlex.quote(root+'/'+rel))
          PY
          ssh -p "$PORT" -i "$HOME/.ssh/beget_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$BEGET_USER@$BEGET_HOST" 'bash -s' < "$RUNNER_TEMP/beget-delete.sh"

      - name: Production health check
        if: steps.config.outputs.configured == 'true' && steps.manifest.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for url in 'https://kapouch.store/' 'https://app.kapouch.store/'; do
            echo "Checking $url"
            curl --fail --location --silent --show-error --output /dev/null \
              --connect-timeout 10 --max-time 25 --retry 3 --retry-delay 3 "$url"
          done

      - name: Mark successful deployment checkpoint
        if: steps.config.outputs.configured == 'true'
        env:
          PORT: ${{ steps.sshcfg.outputs.port }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$TARGET_SHA" | ssh -p "$PORT" -i "$HOME/.ssh/beget_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$BEGET_USER@$BEGET_HOST" "cat > '$BEGET_PATH/.kapouch-deployed-sha'"
          echo "### Deployment checkpoint" >> "$GITHUB_STEP_SUMMARY"
          echo "Beget is aligned with deployable files from commit: \`$TARGET_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing to deploy
        if: steps.config.outputs.configured == 'true' && steps.manifest.outputs.has_changes == 'false'
        shell: bash
        run: echo "No deployable files changed; only the successful deployment checkpoint was advanced." >> "$GITHUB_STEP_SUMMARY"
